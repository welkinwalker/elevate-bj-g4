[project]
name = "elevate-hr-agent"
version = "1.0.0"
description = "Project Elevate: Enterprise HR & IT Agentic Solution built with Google ADK, FastMCP, Model Armor, and Vertex AI Search RAG."
requires-python = ">=3.11, <3.14"
dependencies = [
    "google-adk",
    "google-genai",
    "pydantic>=2.0.0",
    "httpx>=0.27.0",
    "python-dotenv>=1.0.0",
    "pyyaml>=6.0.0",
    "fastapi>=0.110.0",
    "uvicorn>=0.28.0",
    "pytest>=8.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest-asyncio>=0.23.0",
    "ruff>=0.5.0",
    "mypy>=1.10.0",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
